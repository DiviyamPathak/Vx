name: Build Vx Binary

on:
  workflow_dispatch:
  push:
    branches:
      - ci/download-binary
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build vxc (Linux x86_64)
    runs-on: ubuntu-22.04

    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install LLVM 22 and build dependencies
        shell: bash
        run: |
          set -euo pipefail

          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22

          sudo apt-get update -qq
          sudo apt-get install -y \
            llvm-22-dev \
            libmlir-22-dev \
            mlir-22-tools \
            libpolly-22-dev \
            libclang-22-dev \
            ninja-build \
            cmake \
            z3 \
            lld \
            libffi-dev \
            libz3-dev \
            zlib1g-dev \
            libzstd-dev \
            libedit-dev \
            libxml2-dev

          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          llvm-config --version
          clang --version
          mlir-translate --version
          z3 --version
          cargo --version
          rustc --version

      - name: Configure Vx
        shell: bash
        run: |
          set -euo pipefail
          ./setup.sh
          source config.local
          echo "Configured LLVM:"
          llvm-config --version
          echo "Configured Cargo:"
          cargo --version

      - name: Build release compiler with debug symbols
        shell: bash
        run: |
          set -euo pipefail
          source config.local

          # Keep debug information while retaining release optimizations.
          # This produces a binary suitable for development/debugging with gdb/lldb.
          export CARGO_PROFILE_RELEASE_DEBUG=2
          export CARGO_PROFILE_RELEASE_STRIP=false

          cargo build --release --workspace --verbose

      - name: Verify binary and debug symbols
        shell: bash
        run: |
          set -euo pipefail

          test -x target/release/vxc

          echo "Binary information:"
          file target/release/vxc
          ldd target/release/vxc || true

          echo
          echo "Debug sections:"
          readelf -S target/release/vxc | grep -E 'debug_(info|abbrev|line|str)' || true

          echo
          echo "Compiler version/help:"
          ./target/release/vxc --help >/dev/null

      - name: Prepare development artifact
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          cp target/release/vxc dist/vxc-linux-x86_64-debug
          chmod +x dist/vxc-linux-x86_64-debug

          sha256sum dist/vxc-linux-x86_64-debug > dist/vxc-linux-x86_64-debug.sha256

          echo "Development artifacts:"
          ls -lh dist/

      - name: Upload development binary
        uses: actions/upload-artifact@v4
        with:
          name: vxc-linux-x86_64-debug
          path: |
            dist/vxc-linux-x86_64-debug
            dist/vxc-linux-x86_64-debug.sha256
          if-no-files-found: error
          retention-days: 14
